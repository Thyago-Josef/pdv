spring.application.name=pdv

# Control datasource (banco de controle - unico)
app.control.datasource.url=${CONTROL_DB_URL:jdbc:postgresql://localhost:5440/pdv_control}
app.control.datasource.username=${CONTROL_DB_USER:postgres}
app.control.datasource.password=${CONTROL_DB_PASSWORD:postgres}

# Tenant datasource (roteado por tenant via TenantRoutingDataSource)
spring.datasource.url=${TENANT_DB_URL:jdbc:postgresql://localhost:5440/pdv}
spring.datasource.username=${PDV_APP_PASSWORD:pdv_app}
spring.datasource.password=${PDV_APP_PASSWORD:pdv_app}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.leak-detection-threshold=10
spring.datasource.hikari.connection-timeout=30
spring.datasource.hikari.auto-requery-on-shutdown=true
spring.datasource.hikari.validation-timeout=30
spring.datasource.hikari.connection-ttl=1800

# Flyway - migrations
spring.flyway.enabled=true
spring.flyway.user=${PDV_FLYWAY_USER:pdv}
spring.flyway.password=${PDV_FLYWAY_PASSWORD:pdv}
spring.flyway.locations=classpath:db/tenant,classpath:db/control

jwt.secret=${JWT_SECRET:}
jwt.issuer=pdv


# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

