#spring.datasource.url=${TENANT_DB_URL:jdbc:postgresql://localhost:5440/pdv}
spring.datasource.url=jdbc:postgresql://localhost:5440/pdv
spring.datasource.username=pdv
spring.datasource.password=pdv
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.enabled=true
spring.flyway.user=${PDV_FLYWAY_USER:pdv}
spring.flyway.password=${PDV_FLYWAY_PASSWORD:pdv}
spring.flyway.locations=classpath:db/tenant,classpath:db/control

jwt.secret=${JWT_SECRET:dev-secret-key-that-is-at-least-32-bytes-long-for-testing}
jwt.issuer=pdv
