services:
  postgres:
    image: postgres:16
    container_name: pdv-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdv
    ports:
      - "5440:5432"
    volumes:
      - pdv_postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d

volumes:
  pdv_postgres_data:
